name: tsu-stack

services:
  migrate:
    container_name: tsu-stack-migrate
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrator
    environment:
      - "VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:5000}"
      - "VITE_WEB_URL=${VITE_WEB_URL:-http://localhost:3000}"
      - "DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@postgres:5432/${POSTGRES_DB:-tsu-stack}"
      - "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.docker (generate one with vp run auth:secret)}"
    networks:
      - tsu-stack-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    container_name: tsu-stack-server
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        - "SOURCE_COMMIT=${SOURCE_COMMIT}"
        - "VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:5000}"
        - "VITE_WEB_URL=${VITE_WEB_URL:-http://localhost:3000}"
        - "DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@postgres:5432/${POSTGRES_DB:-tsu-stack}"
        - "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.docker (generate one with vp run auth:secret)}"
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      - "VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:5000}"
      - "VITE_WEB_URL=${VITE_WEB_URL:-http://localhost:3000}"
      - "DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@postgres:5432/${POSTGRES_DB:-tsu-stack}"
      - "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.docker (generate one with vp run auth:secret)}"
      - "BETTER_AUTH_TRUSTED_IP_HEADER=${BETTER_AUTH_TRUSTED_IP_HEADER:-}"
      - "ENABLE_OPEN_API_DOCS=${ENABLE_OPEN_API_DOCS:-false}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5000$(echo $VITE_SERVER_URL | sed 's|^http[s]*://[^/]*||' | sed 's|/$||')/health/live || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - tsu-stack-network
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    container_name: tsu-stack-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - "SOURCE_COMMIT=${SOURCE_COMMIT}"
        - "VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:5000}"
        - "VITE_WEB_URL=${VITE_WEB_URL:-http://localhost:3000}"
        - "VITE_IMGPROXY_URL=${VITE_IMGPROXY_URL:-}"
        - "VITE_IMGPROXY_SIGNATURE=${VITE_IMGPROXY_SIGNATURE:-_}"
        - "DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@postgres:5432/${POSTGRES_DB:-tsu-stack}"
        - "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.docker (generate one with vp run auth:secret)}"
    environment:
      - "VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:5000}"
      - "VITE_WEB_URL=${VITE_WEB_URL:-http://localhost:3000}"
      - "VITE_IMGPROXY_URL=${VITE_IMGPROXY_URL:-}"
      - "VITE_IMGPROXY_SIGNATURE=${VITE_IMGPROXY_SIGNATURE:-_}"
      - "DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@postgres:5432/${POSTGRES_DB:-tsu-stack}"
      - "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.docker (generate one with vp run auth:secret)}"
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000$(echo $VITE_WEB_URL | sed 's|^http[s]*://[^/]*||' | sed 's|/$||')/_api/health/live || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - tsu-stack-network
    depends_on:
      server:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: tsu-stack-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      - "POSTGRES_USER=${POSTGRES_USER:-postgres}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}"
      - "POSTGRES_DB=${POSTGRES_DB:-tsu-stack}"
    volumes:
      - tsu-stack-pg-data:/var/lib/postgresql
    networks:
      - tsu-stack-network
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  tsu-stack-pg-data:

networks:
  tsu-stack-network:
