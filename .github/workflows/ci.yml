name: CI

on:
  push:
    branches: [main, variant/merged, variant/merged-cloudflare, variant/merged-cloudflare-d1]
  pull_request:
    branches: [main, variant/merged, variant/merged-cloudflare, variant/merged-cloudflare-d1]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare environment
        shell: bash
        run: |
          cp packages/env/.env.example packages/env/.env
          secret="$(openssl rand -hex 32)"
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=\"$secret\"|" packages/env/.env
      - run: pnpm exec vp run check
      - name: Check generator
        if: github.repository == 'tsu-moe/tsu-stack'
        run: pnpm exec vp run --filter create-tsu-stack check
      - run: pnpm exec vp run test:unit:run
      - name: Check generator package
        if: github.repository == 'tsu-moe/tsu-stack'
        run: pnpm exec vp run --filter create-tsu-stack pack:check
      - name: Verify dry run is mutation-free
        if: github.repository == 'tsu-moe/tsu-stack'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TARGET="$RUNNER_TEMP/create-tsu-stack-dry-run"
          node tools/create-tsu-stack/.output/index.mjs "$TARGET" --yes --dry-run --ref "${{ github.sha }}"
          test ! -e "$TARGET"

  scaffold:
    if: github.repository == 'tsu-moe/tsu-stack'
    strategy:
      fail-fast: false
      matrix:
        # Run the production smoke on the target branch's template.
        source-branch: ["${{ github.base_ref || github.ref_name }}"]
        variant:
          - ${{ fromJSON('{"main":"separate","variant/merged":"merged","variant/merged-cloudflare":"cloudflare","variant/merged-cloudflare-d1":"cloudflare-d1"}')[github.base_ref || github.ref_name] }}
        os: ${{ fromJSON((github.base_ref || github.ref_name) == 'main' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # Also check the CLI built from main against the other published templates.
        include: >-
          ${{ (github.base_ref || github.ref_name) == 'main' && fromJSON('[
            {"os":"ubuntu-latest","variant":"merged","source-branch":"variant/merged"},
            {"os":"ubuntu-latest","variant":"cloudflare","source-branch":"variant/merged-cloudflare"},
            {"os":"ubuntu-latest","variant":"cloudflare-d1","source-branch":"variant/merged-cloudflare-d1"}
          ]') || fromJSON('[]') }}
    runs-on: ${{ matrix.os }}
    env:
      VITE_WEB_URL: http://127.0.0.1:3000/web
      VITE_SERVER_URL: ${{ matrix.variant == 'separate' && 'http://127.0.0.1:5000/server' || 'http://127.0.0.1:3000/web/server' }}
      DATABASE_URL: ${{ matrix.variant != 'cloudflare-d1' && 'postgresql://postgres:smoke-only@127.0.0.1:5432/tsu_stack_smoke' || '' }}
      BETTER_AUTH_SECRET: scaffold-smoke-only-fixture-secret
      WRANGLER_SEND_METRICS: "false"
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && matrix.variant != 'cloudflare-d1' && matrix.source-branch == (github.base_ref || github.ref_name) && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_DB: tsu_stack_smoke
          POSTGRES_PASSWORD: smoke-only
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d tsu_stack_smoke"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run --filter create-tsu-stack build
      - name: Generate ${{ matrix.variant }} project
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ matrix.source-branch }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          ref="$GITHUB_SHA"
          if [[ "$SOURCE_BRANCH" != "$TARGET_BRANCH" ]]; then
            ref="$(git ls-remote --exit-code https://github.com/tsu-moe/tsu-stack.git "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          fi
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]]
          echo "TEMPLATE_SHA=$ref" >> "$GITHUB_ENV"
          node tools/create-tsu-stack/.output/index.mjs "$RUNNER_TEMP/tsu-$VARIANT" --yes --variant "$VARIANT" --no-install --no-git --setup none --ref "$ref"
      - name: Verify generated project
        env:
          SCAFFOLD_PROJECT: ${{ runner.temp }}/tsu-${{ matrix.variant }}
          SCAFFOLD_SOURCE_BRANCH: ${{ matrix.source-branch }}
          SCAFFOLD_VARIANT: ${{ matrix.variant }}
        run: pnpm --filter create-tsu-stack exec vp test src/__tests__/generated-project.test.ts

      - name: Install and validate generated project
        if: matrix.os == 'ubuntu-latest' && matrix.source-branch == (github.base_ref || github.ref_name)
        working-directory: ${{ runner.temp }}/tsu-${{ matrix.variant }}
        run: |
          cp packages/env/.env.example packages/env/.env
          "$GITHUB_WORKSPACE/node_modules/.bin/vp" install
          pnpm exec vp run check
          pnpm exec vp run test:unit:run

      - name: Configure local Worker bindings
        if: matrix.os == 'ubuntu-latest' && matrix.source-branch == (github.base_ref || github.ref_name) && startsWith(matrix.variant, 'cloudflare')
        working-directory: ${{ runner.temp }}/tsu-${{ matrix.variant }}/apps/web
        run: |
          umask 077
          printf 'VITE_WEB_URL=%s\nVITE_SERVER_URL=%s\nBETTER_AUTH_SECRET=%s\n' \
            "$VITE_WEB_URL" "$VITE_SERVER_URL" "$BETTER_AUTH_SECRET" > .dev.vars
          if [[ -n "$DATABASE_URL" ]]; then
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL" >> .dev.vars
          fi

      - name: Migrate PostgreSQL fixture
        if: matrix.os == 'ubuntu-latest' && matrix.source-branch == (github.base_ref || github.ref_name) && (matrix.variant == 'merged' || matrix.variant == 'cloudflare')
        working-directory: ${{ runner.temp }}/tsu-${{ matrix.variant }}
        run: pnpm exec vp run db:migrate

      - name: Migrate local D1 fixture
        if: matrix.os == 'ubuntu-latest' && matrix.source-branch == (github.base_ref || github.ref_name) && matrix.variant == 'cloudflare-d1'
        working-directory: ${{ runner.temp }}/tsu-${{ matrix.variant }}
        run: pnpm exec vp run db:migrate:local

      - name: Build generated production app
        if: matrix.os == 'ubuntu-latest' && matrix.source-branch == (github.base_ref || github.ref_name)
        working-directory: ${{ runner.temp }}/tsu-${{ matrix.variant }}
        run: pnpm exec vp run -r build

      - name: Install Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.source-branch == (github.base_ref || github.ref_name)
        working-directory: ${{ runner.temp }}/tsu-${{ matrix.variant }}/apps/web
        run: pnpm exec vp exec playwright install --with-deps chromium

      - name: Smoke generated production app
        if: matrix.os == 'ubuntu-latest' && matrix.source-branch == (github.base_ref || github.ref_name)
        working-directory: ${{ runner.temp }}/tsu-${{ matrix.variant }}/apps/web
        env:
          PLAYWRIGHT_PRODUCTION_VARIANT: ${{ matrix.variant }}
        run: pnpm exec vp exec playwright test
