name: Release create-tsu-stack

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      package_version: ${{ steps.release.outputs.package_version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Prepare environment
        shell: bash
        run: cp packages/env/.env.example packages/env/.env
      - name: Verify release commit and tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./tools/create-tsu-stack/package.json').version")
          TAG="v$VERSION"
          test "$GITHUB_REF_NAME" = "$TAG"
          test "$(git cat-file -t "$GITHUB_REF")" = "tag"
          test "$(git log -1 --format=%s "$GITHUB_SHA")" = "chore(release): $TAG"
          test "$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")" = "tools/create-tsu-stack/package.json"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG=next
          else
            NPM_TAG=latest
          fi
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: pnpm exec vp run check
      - run: pnpm exec vp run --filter create-tsu-stack check
      - run: pnpm exec vp run test:unit:run
      - run: pnpm exec vp run --filter create-tsu-stack pack:check
      # The package is packed here, where dependencies are installed and no OIDC token is available:
      # the publish job only receives this tarball.
      - name: Pack the package
        id: pack
        working-directory: tools/create-tsu-stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package"
          TARBALL=$(npm pack --silent --pack-destination "$RUNNER_TEMP/package" | tail -n 1)
          cp scripts/verify-npm-publication.mjs "$RUNNER_TEMP/package/verify-npm-publication.mjs"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Verify trusted-publishing npm version
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION=$(npm --version)
          node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error('npm 11.5.1 or newer is required for trusted publishing')" "$NPM_VERSION"
      - name: Publish to npm with trusted publishing
        env:
          NPM_TAG: ${{ needs.validate.outputs.npm_tag }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
          TARBALL: ${{ runner.temp }}/package/${{ needs.validate.outputs.tarball }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          VIEW_OUTPUT=$(npm view "create-tsu-stack@$PACKAGE_VERSION" version --json 2>&1)
          VIEW_STATUS=$?
          set -e

          if [[ $VIEW_STATUS -eq 0 ]]; then
            echo "create-tsu-stack@$PACKAGE_VERSION is already published"
          elif grep -qE 'E404|404 Not Found' <<< "$VIEW_OUTPUT"; then
            set +e
            PACKAGE_OUTPUT=$(npm view create-tsu-stack name --json 2>&1)
            PACKAGE_STATUS=$?
            set -e
            if [[ $PACKAGE_STATUS -ne 0 ]]; then
              if grep -qE 'E404|404 Not Found' <<< "$PACKAGE_OUTPUT"; then
                echo "create-tsu-stack has not been bootstrapped on npm. Perform the first owner-authenticated publish, configure this workflow as the trusted publisher, then rerun this workflow." >&2
              else
                echo "$PACKAGE_OUTPUT" >&2
              fi
              exit "$PACKAGE_STATUS"
            fi
            npm publish "$TARBALL" --access public --tag "$NPM_TAG"
          else
            echo "$VIEW_OUTPUT" >&2
            exit "$VIEW_STATUS"
          fi

          node "$RUNNER_TEMP/package/verify-npm-publication.mjs" create-tsu-stack "$PACKAGE_VERSION"

  github-release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          RELEASE_OUTPUT=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>&1)
          RELEASE_STATUS=$?
          set -e

          if [[ $RELEASE_STATUS -eq 0 ]]; then
            echo "$GITHUB_REF_NAME already has a GitHub release"
          elif grep -q 'HTTP 404' <<< "$RELEASE_OUTPUT"; then
            pnpm exec vp run --filter create-tsu-stack release:github
          else
            echo "$RELEASE_OUTPUT" >&2
            exit "$RELEASE_STATUS"
          fi
